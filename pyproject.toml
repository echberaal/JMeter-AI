[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmeter-ai"
version = "0.1.0"
description = "AI-powered JMeter scripting assistant using LangChain and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ECHBERAAL Anass" }]
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "lxml>=5.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "unstructured>=0.16",
    "structlog>=24.4",
    "click>=8.1",
    "httpx>=0.27",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-lxml>=2024.11",
]

[project.scripts]
jmeter-ai = "jmeter_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jmeter_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jmeter_ai"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/jmeter_ai --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/jmeter_ai"]
omit = ["tests/*"]
